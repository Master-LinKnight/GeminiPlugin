<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Gemini AI 生图</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      margin: 0;
      color: #e0e0e0;
      background-color: #262626;
      font-size: 12px;
      box-sizing: border-box;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      color: #b0b0b0;
    }
    input[type="password"], textarea, select {
      width: 100%;
      box-sizing: border-box;
      background: #1e1e1e;
      border: 1px solid #3c3c3c;
      color: #fff;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 12px;
    }
    input:focus, textarea:focus, select:focus {
      outline: 1px solid #1473e6;
      border-color: #1473e6;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .row .field {
      flex: 1;
    }
    button {
      width: 100%;
      background: #1473e6;
      border: none;
      color: #fff;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) {
      background: #0d66d0;
    }
    button:disabled {
      background: #484848;
      color: #8e8e8e;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.4;
      word-break: break-all;
      color: #999;
      min-height: 20px;
    }
    .hint {
      font-size: 10px;
      color: #777;
      margin-top: 3px;
    }
  </style>
</head>
<body>
  <div class="field">
    <label for="apiKey">Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="输入以 AIzaSy 开头的 Key" />
    <div class="hint">Key 仅保存在本地 PS 缓存中，直连 Google 官方</div>
  </div>

  <div class="field">
    <label for="modelSelect">模型引擎</label>
    <select id="modelSelect">
      <option value="gemini-3-pro-image" selected>Nano Banana Pro (Gemini 3 Pro Image)</option>
      <option value="gemini-3-flash-image">Nano Banana 2 (Gemini 3 Flash Image)</option>
    </select>
  </div>

  <div class="row">
    <div class="field">
      <label for="aspectRatioSelect">画面比例</label>
      <select id="aspectRatioSelect">
        <option value="1:1" selected>1:1 (正方形)</option>
        <option value="16:9">16:9 (横版宽屏)</option>
        <option value="9:16">9:16 (竖屏海报)</option>
        <option value="4:3">4:3 (标准横屏)</option>
        <option value="3:2">3:2 (单反横幅)</option>
      </select>
    </div>
    <div class="field">
      <label for="resSelect">分辨率</label>
      <select id="resSelect">
        <option value="2K" selected>2K (推荐)</option>
        <option value="1K">1K (极速)</option>
        <option value="4K">4K (极限高质)</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label for="prompt">生成提示词 (Prompt)</label>
    <textarea id="prompt" rows="5" placeholder="描述想要生成的画面。如需精确文字排版，请用英文双引号包裹文字，例如: A neon sign reading &quot;COFFEE&quot;..."></textarea>
  </div>

  <button id="generateBtn">生成并置入画板</button>
  <div id="status"></div>

  <script src="index.js"></script>
</body>
</html>
