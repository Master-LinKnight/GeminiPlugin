<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Gemini AI 创成式填充与生图</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background-color: #262626;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    body {
      padding: 12px;
      padding-bottom: 24px;
    }

    /* 滚动条美化 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #4a4a4a;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #606060;
    }

    .field {
      margin-bottom: 10px;
    }
    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    label {
      display: block;
      font-weight: 600;
      color: #b0b0b0;
      font-size: 11px;
    }
    .test-link {
      color: #38bdf8;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
      user-select: none;
    }
    .test-link:hover {
      text-decoration: underline;
    }
    input[type="password"], textarea, select {
      width: 100%;
      box-sizing: border-box;
      background: #1e1e1e;
      border: 1px solid #3c3c3c;
      color: #fff;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #1473e6;
    }
    textarea {
      resize: vertical;
      min-height: 56px;
      line-height: 1.4;
    }

    .row {
      display: flex;
      gap: 8px;
    }
    .row .field {
      flex: 1;
      min-width: 0;
    }

    /* 自定义纯 CSS 胶囊选项卡 (不用 button 避免 UXP 原生按钮控件劫持) */
    .tabs-wrapper {
      background: #181818;
      border: 1px solid #363636;
      border-radius: 6px;
      padding: 3px;
      margin-bottom: 12px;
      display: flex;
      gap: 3px;
      width: 100%;
    }
    .tab-item {
      flex: 1;
      padding: 6px 2px;
      text-align: center;
      border-radius: 4px;
      color: #8e8e8e;
      font-weight: 500;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tab-item:hover {
      color: #ddd;
    }
    .tab-item.active {
      background: #363636;
      color: #fff;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* 选区提示盒 */
    .tip-box {
      background: #1c2430;
      border: 1px solid #2d3b4e;
      border-radius: 4px;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 11px;
      line-height: 1.4;
      color: #94a3b8;
    }
    .tip-box strong {
      color: #38bdf8;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      font-size: 11px;
      color: #aaa;
      cursor: pointer;
    }
    .checkbox-row input {
      margin: 0;
      cursor: pointer;
    }

    /* 参考图选择行 */
    .ref-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ghost-btn {
      background: #2f2f2f;
      border: 1px solid #3c3c3c;
      color: #ddd;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      appearance: none;
      -webkit-appearance: none;
    }
    .ghost-btn:hover {
      background: #3a3a3a;
      border-color: #4a4a4a;
    }
    .ref-name {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      color: #8e8e8e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ref-name.has-file {
      color: #69db7c;
    }

    .primary-btn {
      width: 100%;
      background: #1473e6;
      border: none;
      color: #fff;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      transition: background 0.2s;
      margin-top: 4px;
    }
    .primary-btn:hover:not(:disabled) {
      background: #0d66d0;
    }
    .primary-btn:disabled {
      background: #484848;
      color: #8e8e8e;
      cursor: not-allowed;
    }

    #status {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.4;
      word-break: break-all;
      color: #999;
      min-height: 18px;
    }
    .hint {
      font-size: 10px;
      color: #777;
      margin-top: 3px;
    }
  </style>
</head>
<body>
  <!-- API Key 配置 -->
  <div class="field">
    <div class="field-header">
      <label for="apiKey">Gemini API Key</label>
      <span class="test-link" id="testKeyBtn">⚡ 测试连接</span>
    </div>
    <input type="password" id="apiKey" placeholder="输入以 AIzaSy 开头的 Key" />
    <div class="hint">直连 Google 官方，Key 仅保存在本地 PS 缓存</div>
  </div>

  <!-- 模式切换 Tabs（使用 div 容器彻底规避 UXP button 宽度限制） -->
  <div class="tabs-wrapper">
    <div class="tab-item active" id="tabInpaintBtn">🪄 局部重绘</div>
    <div class="tab-item" id="tabT2IBtn">🎨 全新生图</div>
  </div>

  <!-- Tab 1: 创成式填充 (Generative Fill / Inpainting) -->
  <div id="tabInpaint" class="tab-content active">
    <div class="tip-box">
      <strong>✨ 局部重绘工作流：</strong><br>
      在画布圈出选区 -> 输入填充指令 -> 自动生成并赋予蒙版。
    </div>

    <div class="row">
      <div class="field">
        <label for="inpaintModelSelect">模型引擎</label>
        <select id="inpaintModelSelect">
          <option value="gemini-nano-banana-2.1" selected>Nano Banana 2.1 (最新)</option>
          <option value="gemini-3.1-flash-image">Nano Banana 2 (性价比)</option>
          <option value="gemini-3-pro-image">Nano Banana Pro (极致)</option>
        </select>
      </div>
      <div class="field">
        <label for="inpaintResSelect">生成画质</label>
        <select id="inpaintResSelect">
          <option value="4K" selected>4K (超清)</option>
          <option value="2K">2K (平衡)</option>
          <option value="1K">1K (极速)</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="inpaintPrompt">填充/修改提示词 (Prompt)</label>
      <textarea id="inpaintPrompt" rows="3" placeholder="例如: 移除选区中的电线杆并填充蓝天；或者: 在草地上添加一只金毛犬..."></textarea>
    </div>

    <div class="field">
      <div class="field-header">
        <label>参考图（可选）</label>
        <span class="test-link" id="inpaintRefClear" style="display:none">✕ 清除</span>
      </div>
      <div class="ref-row">
        <button type="button" class="ghost-btn" id="inpaintRefBtn">📎 选择参考图</button>
        <span class="ref-name" id="inpaintRefName">未选择</span>
      </div>
      <div class="hint">仅作风格/主体参考，不复制其构图；建议不超过 8MB</div>
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="autoMaskCheckbox" checked />
      <span>自动应用选区蒙版（方便微调）</span>
    </label>

    <button id="inpaintBtn" class="primary-btn">🪄 立即执行局部重绘</button>
  </div>

  <!-- Tab 2: 全新文生图 (Text to Image) -->
  <div id="tabT2I" class="tab-content">
    <div class="row">
      <div class="field">
        <label for="t2iModelSelect">模型引擎</label>
        <select id="t2iModelSelect">
          <option value="gemini-nano-banana-2.1" selected>Nano Banana 2.1 (最新)</option>
          <option value="gemini-3.1-flash-image">Nano Banana 2 (性价比)</option>
          <option value="gemini-3-pro-image">Nano Banana Pro (极致)</option>
        </select>
      </div>
      <div class="field">
        <label for="t2iResSelect">画质</label>
        <select id="t2iResSelect">
          <option value="4K" selected>4K (超清)</option>
          <option value="2K">2K (推荐)</option>
          <option value="1K">1K (极速)</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="t2iAspectSelect">画面比例</label>
      <select id="t2iAspectSelect">
        <option value="1:1" selected>1:1 (正方形)</option>
        <option value="16:9">16:9 (横版宽屏)</option>
        <option value="9:16">9:16 (竖屏海报)</option>
        <option value="4:3">4:3 (标准横屏)</option>
        <option value="3:4">3:4 (标准竖屏)</option>
        <option value="3:2">3:2 (单反横屏)</option>
        <option value="2:3">2:3 (单反竖屏)</option>
      </select>
    </div>

    <div class="field">
      <label for="t2iPrompt">生成提示词 (Prompt)</label>
      <textarea id="t2iPrompt" rows="3" placeholder="描述想要生成的画面。排版文字请用英文双引号包裹..."></textarea>
    </div>

    <div class="field">
      <div class="field-header">
        <label>参考图（可选）</label>
        <span class="test-link" id="t2iRefClear" style="display:none">✕ 清除</span>
      </div>
      <div class="ref-row">
        <button type="button" class="ghost-btn" id="t2iRefBtn">📎 选择参考图</button>
        <span class="ref-name" id="t2iRefName">未选择</span>
      </div>
      <div class="hint">参考其风格/主体/配色，生成新画面；建议不超过 8MB</div>
    </div>

    <button id="t2iBtn" class="primary-btn">🎨 生成新画面置入画板</button>
  </div>

  <!-- 状态提示 -->
  <div id="status"></div>

  <script src="index.js"></script>
</body>
</html>
